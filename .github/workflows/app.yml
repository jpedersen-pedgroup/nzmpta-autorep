# App CI/CD — build + test on every PR, deploy to staging on merge to main.
# Auth: federated OIDC (same App Registration as the infra workflows).
# Prod deploy is a manual flow — see app-prod.yml.

name: App (build + staging deploy)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - '.config/**'
      - 'Autorep.sln'
      - '.github/workflows/app.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - '.config/**'
      - 'Autorep.sln'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for federated OIDC
  contents: read

concurrency:
  group: app-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Autorep.sln

      - name: Build
        run: dotnet build Autorep.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Autorep.sln --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish src/Autorep.Web/Autorep.Web.csproj --no-build --configuration Release --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-nzmpta-autorep-staging
          package: ./publish

      - name: Health check
        run: |
          # Give App Service a moment to settle after deploy
          sleep 20
          URL="https://app-nzmpta-autorep-staging.azurewebsites.net/health"
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: $URL → $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts"
          exit 1
